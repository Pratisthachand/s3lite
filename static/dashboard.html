<!doctype html>
<html>
  <head>
    <title>S3-Lite Dashboard</title>
    <style>
      body {
        font-family: Arial;
        background: #f5f5f5;
        padding: 20px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
      .card {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 4px;
      }
      .label {
        color: #666;
        font-size: 12px;
        font-weight: bold;
      }
      .value {
        font-size: 28px;
        font-weight: bold;
        color: #0066cc;
      }
    </style>
  </head>
  <body>
    <h1>S3-Lite Dashboard</h1>
    <div class="stats">
      <div class="card">
        <div class="label">Total Objects</div>
        <div class="value" id="count">-</div>
      </div>
      <div class="card">
        <div class="label">Unique Data (MB)</div>
        <div class="value" id="unique">-</div>
      </div>
      <div class="card">
        <div class="label">Logical Data (MB)</div>
        <div class="value" id="logical">-</div>
      </div>
      <div class="card">
        <div class="label">Space Saved (%)</div>
        <div class="value" id="saved">-</div>
      </div>
    </div>
    <script>
      async function update() {
        try {
          const res = await fetch("/metrics");
          const data = await res.json();
          document.getElementById("count").innerText = data.object_count;
          document.getElementById("unique").innerText = (
            data.unique_bytes / 1e6
          ).toFixed(2);
          document.getElementById("logical").innerText = (
            data.logical_bytes / 1e6
          ).toFixed(2);
          document.getElementById("saved").innerText = data.savings_percentage;
        } catch (e) {
          console.error("Failed to update:", e);
        }
      }
      update();
      setInterval(update, 2000);
    </script>
  </body>
</html>
